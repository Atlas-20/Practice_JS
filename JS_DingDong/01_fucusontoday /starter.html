<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus on Today</title>
    <link rel="stylesheet" href="starter.css">
    <script src="starter.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main >
        <h1>Focus on <span>Today</span> </h1>
        <div class="cardcontainer">
           
                <h2 class="item_1">Today <img src="Sun.svg" alt="" srcset="">  </h2>
                <!-- <div class="item_2"><img src="Sun.svg" alt="" srcset=""></div> -->
              <!-- <progress value="32" max="100"> 32% </progress> -->
                <p>Raise the bar by completing your goals !</p>
                <div class="progressbar" >
                    <p class="progressvalue"> 
                        <span></span>
                    </p>
                </div>
               <p class="goal-alert">Please set all the three goals !</p>
               <div class="first-checker ">
                    <div class="checkbox">
                        <img src="check-icon.svg" alt="" srcset="">
                    </div>
                    <input  class="inputfield" type="text" id ="text" placeholder="Add a new goal....." > 
                    <!-- a form field element like input must have id or  -->
               </div>
                <div class="second-checker">
                    <div class="checkbox">
                        <img src="check-icon.svg" alt="" srcset="">
                    </div>
                    <input  class="inputfield" type="text" id ="text2" placeholder="Add a new goal....." > 
                    <!-- a form field element like input must have id or  -->
               </div>
                <div class="third-checker">
                    <div class="checkbox">
                        <img src="check-icon.svg" alt="" srcset="">
                    </div>
                    <input class="inputfield" type="text" id ="text3" placeholder="Add a new goal....." > 
                    <!-- a form field element like input must have id or  -->
                     
               </div>
               <p class="bottom-text">“Move one step ahead, today!”</p>
                <p class="last-text">Made with ❤️ by Anurag Singh</p>
        </div>


    </main>
  
</body>
</html>
